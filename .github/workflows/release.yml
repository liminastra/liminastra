# .github/workflows/release.yml
#
# Publishes to PyPI when a GitHub Release is published.
# Uses Trusted Publishing (OIDC) — no API token is stored anywhere.
#
# The workflow FILENAME (release.yml) and the environment name (release) must
# match exactly what you register in the PyPI pending publisher form.

name: release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # required for Trusted Publishing; nothing else needed

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata renders
        run: uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1